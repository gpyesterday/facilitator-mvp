<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B1-1 LLM 기반 업무 자동화 - 퍼실리테이션 가이드</title>
</head>
<body>
<p id="loading" style="font-family:sans-serif;padding:24px;color:#666">가이드 로딩 중…</p>
<script>
(async () => {
  const n = 4;
  const parts = await Promise.all(
    Array.from({length: n}, (_, i) =>
      fetch('/guides/b1-1.b64.' + i + '.txt').then(r => r.text())
    )
  );
  const b64 = parts.join('').replace(/\s/g, '');
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  const ab = await new Response(stream).arrayBuffer();
  const html = new TextDecoder().decode(ab);
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  document.getElementById('loading').textContent = '로드 실패: ' + e;
});
</script>
</body>
</html>
